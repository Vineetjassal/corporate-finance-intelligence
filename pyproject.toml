[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-finance-intelligence"
version = "1.0.0"
description = "Auditable corporate-finance metrics and transparent risk flags"
requires-python = ">=3.10"

[project.scripts]
corporate-finance = "src.corporate_finance.cli:main"

[tool.setuptools]
packages = ["src", "src.corporate_finance"]
